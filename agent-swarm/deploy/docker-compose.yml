# n8n + Caddy (HTTPS automatik) untuk VPS. Telegram perlukan HTTPS untuk webhook.
# Guna: salin .env.example ke .env, isi nilai, kemudian: docker compose up -d
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.45.3
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_DOMAIN}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=https://${N8N_DOMAIN}/
      - GENERIC_TIMEZONE=Asia/Kuala_Lumpur
      - TZ=Asia/Kuala_Lumpur
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OWNER_CHAT_ID=${OWNER_CHAT_ID}
      - N8N_RUNNERS_ENABLED=true
    volumes:
      - n8n_data:/home/node/.n8n
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - N8N_DOMAIN=${N8N_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../office:/srv/office:ro
      - caddy_data:/data
volumes:
  n8n_data:
  caddy_data:
